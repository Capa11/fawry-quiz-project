spring.config.import=optional:file:./.env[.properties]
spring.application.name=Quiz
logging.level.org.springframework.*=DEBUG

spring.security.user.name=${SECURITY_USER_NAME}
spring.security.user.password=${SECURITY_USER_PASSWORD}
server.port= 8080
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

## Spring DATASOURCE (DataSourceAutoConfiguration & DataSourceProperties)
spring.datasource.url=${DB_URL}
#spring.datasource.url=jdbc:h2:mem:testdb
#spring.datasource.driverClassName=org.h2.Driver
#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true

## Hibernate Properties
# The SQL dialect makes Hibernate generate better SQL for the chosen database
#spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto = update


## Hibernate Logging
logging.level.org.hibernate.SQL= DEBUG
#If you want to also see the actual values in your SQL queries (not just ? placeholders)
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#logging.level.org.hibernate.type.descriptor.sql=trace
logging.level.org.hibernate.orm.jdbc.bind=TRACE




logging.level.root=INFO
logging.level.sun.rmi=ERROR
logging.level.sun.rmi.transport.tcp=ERROR
logging.level.javax.management.remote.rmi=ERROR
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.mode= always
#

# Initialize the datasource with available DDL and DML scripts
#This tells Spring Boot to always run SQL scripts (like schema.sql, data.sql) on application startup  even if you're using an embedded or external database.
#spring.datasource.initialization-mode=always
#This tells Spring Boot to delay JPA (Hibernate) initialization until after the SQL scripts (like data.sql) are executed.
#spring.jpa.defer-datasource-initialization= true


## Jackson Properties
#With this property set to false, dates will be formatted as ISO-8601 human-readable (e.g "createdAt": "2023-11-08T15:07:03.942Z")
spring.jackson.serialization.WRITE_DATES_AS_TIMESTAMPS= false
#set the application time zone to cairo
spring.jackson.time-zone=Africa/Cairo

### App Properties
spring.app.jwtSecret=${JWT_SECRET}
## This sets how long the token is valid before expiring. 604800000 ms = 7 days
spring.app.jwtExpirationInMs = 604800000

# to define which frontend origin is allowed for CORS (Cross-Origin Resource Sharing)
#app.cors.allowedOrigins = http://localhost:3000

frontend.url = http://localhost:3000

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.shutdown.enabled=true
management.info.env.enabled=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

